<script>
// ===================== НАЛАШТУВАННЯ =====================
const T = 32, W = 21, H = 15, HUD = 40;
const FONT = '"Press Start 2P", "Courier New", monospace';
const EMOJI = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W * T; cv.height = H * T + HUD;
const bg = document.getElementById('bg'), bctx = bg.getContext('2d');
let gameCssW = cv.width;
function fit() {
  const s = Math.min(innerWidth / cv.width, innerHeight / cv.height) * 0.96;
  gameCssW = cv.width * s;
  cv.style.width = gameCssW + 'px'; cv.style.height = cv.height * s + 'px';
  const dpr = devicePixelRatio || 1;
  bg.width = innerWidth * dpr; bg.height = innerHeight * dpr;
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', fit); fit();

// # стіна  . підлога  R Рома  C Крим  i річ  e енергетик  f прапор  E вихід
// B ліжко  D стіл  P комп  W шафа  S диван  K плита  F холодильник  T стіл  L полиця  X коробки
const LEVELS = [
  {
    name: 'Кімната Роми', style: 'wood', floor: ['#7a5434', '#714d2f'], wall: '#8f97b0',
    speed: 6.2, cspeed: [4.4], rand: 0.12,
    items: [['📱','телефон'],['🔑','ключі'],['🎧','навушники'],['🧦','шкарпетки'],['🔌','зарядка'],['💳','картка'],['🎮','джойстик']],
    map: [
      '#####################',
      '#R...i#BBB#...i...WW#',
      '#.##..#BBB#.##.##.WW#',
      '#.##.......##.....e.#',
      '#....##.#.....#.##..#',
      '#i.#.##.#.DDP.#.##.i#',
      '#..#....#.DDP.#.....#',

      '#f......i...C.......#',
      '#.##.#####.####.###.#',
      '#.##.....#.#......#.#',
      '#i...SSS.#...i.##...#',
      '#.##.SSS.###.#.##.#.#',
      '#...................E',
      '#####################',
    ]
  },
  {
    name: 'Коридор і кухня', style: 'tile', floor: ['#d8d2c4', '#c6bfae'], wall: '#7d8f6a',
    speed: 6.2, cspeed: [5.0], rand: 0.08,
    items: [['🥪','бутер'],['👟','кросівки'],['🧥','куртка'],['☕','кава'],['🍌','банан'],['🧃','сік']],
    map: [
      '#####################',
      '#KKKFF#....i....#LLL#',
      '#.........##.##.....#',
      '#.TT.##.#....##.#.#.#',
      '#.TT.##.#.##....#.#i#',
      '#i......#.##.####...#',
      '###.###.....e.......#',
      '#...#.....#####.###.#',
      '#.#.#.###.....#...#.#',
      '#.#...#f#.#C#.#.#.#.#',
      '#.###.#.#.#.#...#...#',
      '#i....#...#.#####.#.#',
      '#.###...#.....i...#.#',
      'E...#.i.#.###.#....R#',
      '#####################',
    ]
  },
  {
    name: "Під'їзд", style: 'concrete', floor: ['#585a63', '#51535c'], wall: '#5d7391',
    speed: 6.3, cspeed: [4.5, 4.8], rand: 0.15,
    items: [['🎒','рюкзак'],['🧢','кепка'],['🕶️','окуляри'],['📦','посилка'],['💸','гроші'],['🚲','велик']],
    map: [
      '#####################',
      '#R....#.....i.#....f#',
      '#.###.#.#####.#.###.#',
      '#.#i....#...#...#...#',
      '#.#.###.#.#.#####.#.#',
      '#...#...e.#.......#.#',
      '###.#.#####.###.###.#',
      '#i....#..C..C.#.....#',
      '#.###.#.#####.#.###.#',
      '#...#.....i.....#i..#',
      '#.#.#####.###.#.#.###',
      '#.#.......#...#.....#',
      '#.#####.#.#.#######.#',
      '#f......#X..i.......#',
      '##########E##########',
    ]
  }
];

// Контур півострова Крим (x: 0..1, y: 0..0.92)
const CRIMEA = [[.33,0],[.38,.02],[.40,.10],[.48,.14],[.56,.18],[.62,.26],[.72,.36],[.82,.34],[.92,.36],[1,.40],
  [.97,.48],[.90,.50],[.82,.52],[.74,.56],[.66,.62],[.58,.70],[.50,.78],[.42,.86],[.34,.92],[.28,.90],[.24,.82],
  [.22,.74],[.24,.64],[.18,.58],[.10,.52],[.02,.46],[0,.40],[.08,.34],[.18,.30],[.26,.22],[.30,.10]];

const DIRS = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];

// ===================== СТАН =====================
let state = 'title', lvl = 0, L, grid, items, powers, roma, crimeas, exitT, unlocked, total, got;
let lives = 3, score = 0, want = null, scared = 0, boost = 0, stateT = 0, levelTime = 0, totalTime = 0;
// фрази, що падають на фоні
const PHRASES = [
  'вона тобі не треба', 'третій раз не проканає', 'подумай головою, вона тобі не дасть',
  'Ромо, не пиши їй', 'прочитала і не відповіла', 'краще пограй в доту',
  'тікай, поки не пізно', 'друзі > вона', 'не будь лохом', 'вона знову тебе кине',
];
let falling = [], fallT = 0;
let msgs = [], parts = [], shake = 0, mapCanvas, now = 0, walk = 0, levelBonus = 0;

// ===================== УТИЛІТИ =====================
function hsh(x, y) {
  let n = Math.imul(x, 374761393) + Math.imul(y, 668265263);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function shade(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  const c = v => Math.max(0, Math.min(255, Math.round(v + a)));
  return `rgb(${c(n >> 16)},${c((n >> 8) & 255)},${c(n & 255)})`;
}
let AC;
function getAC() { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function beep(f, d, type = 'square', vol = 0.06, slide = 0, delay = 0) {
  try {
    getAC();
    const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + d);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d);
  } catch (e) {}
}
// ===================== МУЗИКА =====================
// Поклади поруч з грою файл music.mp3 (напр. «Не трогайте осень») — гратиме він.
// Якщо файлу немає — грає вбудована осіння 8-бітна мелодія.
const music = new Audio('music.mp3'); music.loop = true; music.volume = 0.1;
const SYNTH_VOL = 0.22;
let musicOn = true, musicStarted = false, synthOn = false, musicGain, seqStep = 0, nextT = 0;
const STEP = 60 / 104 / 2;
const MEL = [
  [76, 0, 74, 72, 71, 72], [74, 0, 72, 71, 69, 71], [72, 0, 71, 69, 67, 69], [71, 72, 74, 76, 0, 0],
  [77, 0, 76, 74, 72, 74], [76, 0, 74, 72, 71, 69], [71, 0, 68, 69, 71, 74], [72, 71, 0, 68, 0, 0],
];
const CH = [[45, 52, 57, 60], [50, 57, 62, 65], [43, 50, 55, 59], [48, 55, 60, 64],
  [41, 48, 53, 57], [50, 57, 62, 65], [40, 47, 52, 56], [40, 47, 52, 56]];
const ARP = [0, 1, 2, 3, 2, 1];
function note(m, t, d, type, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = 440 * 2 ** ((m - 69) / 12);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(musicGain); o.start(t); o.stop(t + d + 0.02);
}
function schedSynth() {
  if (!synthOn) return;
  while (nextT < AC.currentTime + 0.2) {
    const bar = ((seqStep / 6) | 0) % 8, i = seqStep % 6, m = MEL[bar][i];
    if (m) note(m, nextT, STEP * 1.8, 'triangle', 0.07);
    note(CH[bar][ARP[i]], nextT, STEP * 0.9, 'square', 0.02);
    seqStep++; nextT += STEP;
  }
}
setInterval(schedSynth, 50);
function startSynth() {
  getAC();
  if (!musicGain) { musicGain = AC.createGain(); musicGain.connect(AC.destination); }
  musicGain.gain.value = musicOn ? SYNTH_VOL : 0;
  if (!synthOn) { synthOn = true; nextT = AC.currentTime + 0.05; }
}
function startMusic() {
  if (musicStarted) return;
  musicStarted = true;
  music.play().catch(startSynth);
}
function toggleMusic() {
  musicOn = !musicOn;
  if (synthOn) musicGain.gain.value = musicOn ? SYNTH_VOL : 0;
  else if (musicStarted) musicOn ? music.play().catch(() => {}) : music.pause();
  toast(musicOn ? 'Музика: увімк.' : 'Музика: вимк.');
}

function toast(text) { msgs.push({ text, t: 2.2 }); if (msgs.length > 3) msgs.shift(); }
function burst(x, y, color, n = 12, sp = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.4 + Math.random()) * sp;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6 + Math.random() * 0.4, color, s: 3 });
  }
}

// ===================== РІВЕНЬ =====================
const isSolid = c => c !== '.' && c !== 'E';
function open(x, y, who) {
  if (x < 0 || y < 0 || x >= W || y >= H) return false;
  const c = grid[y][x];
  if (c === '.') return true;
  if (c === 'E') return who === 'roma' && unlocked;
  return false;
}
function mkEnt(x, y, speed) { return { tx: x, ty: y, sx: x, sy: y, dir: { x: 0, y: 0 }, prog: 0, moving: false, speed, home: 0 }; }
function pos(e) { return { x: e.tx + e.dir.x * e.prog, y: e.ty + e.dir.y * e.prog }; }

function loadLevel(i) {
  L = LEVELS[i]; grid = L.map.map(r => r.split(''));
  items = []; powers = []; const cs = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = grid[y][x];
    if (c === 'R') roma = mkEnt(x, y, L.speed);
    if (c === 'C') cs.push({ x, y });
    if (c === 'i') items.push({ x, y, k: L.items[items.length % L.items.length], got: false });
    if (c === 'e' || c === 'f') powers.push({ x, y, t: c, got: false });
    if (c === 'E') exitT = { x, y };
    if ('RCief'.includes(c)) grid[y][x] = '.';
  }
  crimeas = cs.map((s, k) => mkEnt(s.x, s.y, L.cspeed[k] || L.cspeed[0]));
  total = items.length; got = 0; unlocked = false; scared = 0; boost = 0; levelTime = 0; want = null;
  crimeas.forEach(c => c.home = 1.2);
  renderMap();
}

function resetPositions() {
  for (const e of [roma, ...crimeas]) { e.tx = e.sx; e.ty = e.sy; e.prog = 0; e.moving = false; e.dir = { x: 0, y: 0 }; }
  crimeas.forEach(c => c.home = 1.2);
  scared = 0; boost = 0; want = null;
}

function newGame() {
  lives = 3; score = 0; totalTime = 0; lvl = 0; msgs = [];
  loadLevel(0); state = 'ready'; stateT = 0;
  beep(523, .1); beep(659, .1, 'square', .06, 0, .1); beep(784, .15, 'square', .06, 0, .2);
}

// ===================== РУХ =====================
function stepEnt(e, dt, choose, arrive) {
  let mv = e.speed * dt, guard = 0;
  while (mv > 0 && guard++ < 10) {
    if (!e.moving) {
      const d = choose(e);
      if (!d) return;
      e.dir = d; e.moving = true; e.prog = 0;
    }
    const rem = 1 - e.prog;
    if (mv >= rem) {
      mv -= rem; e.tx += e.dir.x; e.ty += e.dir.y; e.prog = 0; e.moving = false;
      if (arrive) arrive(e);
      if (state !== 'play') return;
    } else { e.prog += mv; mv = 0; }
  }
}
function reverse(e) {
  e.tx += e.dir.x; e.ty += e.dir.y; e.prog = 1 - e.prog; e.dir = { x: -e.dir.x, y: -e.dir.y };
}

function romaChoose(e) {
  if (want && open(e.tx + want.x, e.ty + want.y, 'roma')) return want;
  if ((e.dir.x || e.dir.y) && open(e.tx + e.dir.x, e.ty + e.dir.y, 'roma')) return e.dir;
  return null;
}

function romaArrive(e) {
  const px = e.tx * T + T / 2, py = e.ty * T + T / 2;
  const it = items.find(i => !i.got && i.x === e.tx && i.y === e.ty);
  if (it) {
    it.got = true; got++; score += 100;
    toast(`${it.k[0]} ${it.k[1]} +100`);
    burst(px, py, '#ffe66b', 14);
    beep(880, .07); beep(1320, .09, 'square', .05, 0, .07);
    if (got === total) {
      unlocked = true;
      toast('Все зібрано! Двері відчинено — БІЖИ!');
      beep(523, .12, 'triangle', .1); beep(784, .12, 'triangle', .1, 0, .1); beep(1046, .25, 'triangle', .1, 0, .2);
    }
  }
  const pw = powers.find(p => !p.got && p.x === e.tx && p.y === e.ty);
  if (pw) {
    pw.got = true; score += 50;
    if (pw.t === 'e') {
      boost = 4.5; toast('Енергетик! Рома прискорився ⚡');
      burst(px, py, '#6bff9a', 16); beep(300, .3, 'sawtooth', .05, 900);
    } else {
      scared = 6; toast('Слава Україні! Крим злякався!');
      burst(px, py, '#3d7bff', 10); burst(px, py, '#ffd500', 10);
      crimeas.forEach(c => { if (c.moving) reverse(c); });
      beep(392, .12, 'square', .07); beep(523, .12, 'square', .07, 0, .12); beep(659, .3, 'square', .07, 0, .24);
    }
  }
  if (exitT && e.tx === exitT.x && e.ty === exitT.y) {
    levelBonus = Math.max(50, Math.round(600 - levelTime * 6));
    score += levelBonus; state = 'levelup'; stateT = 0;
    [523, 659, 784, 1046, 784, 1046].forEach((f, i) => beep(f, .14, 'square', .07, 0, i * .11));
  }
}

function bfs(sx, sy) {
  const d = new Array(W * H).fill(1e9), q = [sx + sy * W];
  d[q[0]] = 0;
  for (let h = 0; h < q.length; h++) {
    const c = q[h], x = c % W, y = (c / W) | 0;
    for (const k of DIRS) {
      const nx = x + k.x, ny = y + k.y;
      if (open(nx, ny, 'crim') && d[nx + ny * W] > d[c] + 1) { d[nx + ny * W] = d[c] + 1; q.push(nx + ny * W); }
    }
  }
  return d;
}

function crimChoose(e, k) {
  const rp = pos(roma);
  let tx = Math.round(rp.x), ty = Math.round(rp.y);
  // другий Крим намагається перехопити Рому попереду
  if (k === 1 && Math.abs(tx - e.tx) + Math.abs(ty - e.ty) > 4) {
    for (let s = 4; s > 0; s--) {
      const ax = tx + roma.dir.x * s, ay = ty + roma.dir.y * s;
      if (open(ax, ay, 'crim')) { tx = ax; ty = ay; break; }
    }
  }
  const dist = bfs(tx, ty);
  let opts = DIRS.filter(d => open(e.tx + d.x, e.ty + d.y, 'crim'));
  if (!opts.length) return null;
  const fwd = opts.filter(d => !(d.x === -e.dir.x && d.y === -e.dir.y));
  if (fwd.length) opts = fwd;
  if (Math.random() < (scared > 0 ? 0.3 : L.rand)) return opts[(Math.random() * opts.length) | 0];
  const sc = d => dist[(e.tx + d.x) + (e.ty + d.y) * W] * (scared > 0 ? -1 : 1);
  opts.sort((a, b) => sc(a) - sc(b));
  return opts[0];
}

// ===================== ОНОВЛЕННЯ =====================
function update(dt) {
  stateT += dt;
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  msgs.forEach(m => m.t -= dt); msgs = msgs.filter(m => m.t > 0);
  shake = Math.max(0, shake - dt * 20);

  // фрази падають по боках від ігрового поля
  fallT -= dt;
  const side = (innerWidth - gameCssW) / 2;
  if (fallT <= 0) {
    fallT = 0.7 + Math.random() * 0.7;
    const left = Math.random() < .5, zone = side > 90 ? side : innerWidth;
    const size = 13 + ((Math.random() * 5) | 0), maxW = Math.max(60, zone - 24);
    bctx.font = `${size}px ${FONT}`;
    const lines = [];
    for (const word of PHRASES[(Math.random() * PHRASES.length) | 0].split(' ')) {
      const cur = lines[lines.length - 1];
      if (cur && bctx.measureText(cur + ' ' + word).width <= maxW) lines[lines.length - 1] = cur + ' ' + word;
      else lines.push(word);
    }
    const w = Math.max(...lines.map(l => bctx.measureText(l).width));
    const x0 = side > 90 ? (left ? 0 : innerWidth - side) : 0;
    falling.push({
      lines, size, x: x0 + 12 + w / 2 + Math.random() * Math.max(0, zone - w - 24), y: -20 - lines.length * size * 1.6,
      vy: 40 + Math.random() * 35, rot: (Math.random() - .5) * .2, a: .7 + Math.random() * .3,
      color: ['#ff8fb1', '#ffd500', '#9ecbff', '#ffffff', '#6bff9a'][(Math.random() * 5) | 0],
    });
  }
  for (const f of falling) f.y += f.vy * dt;
  falling = falling.filter(f => f.y < innerHeight + 40);

  if (state === 'play') {
    levelTime += dt; totalTime += dt;
    scared = Math.max(0, scared - dt); boost = Math.max(0, boost - dt);
    roma.speed = boost > 0 ? 8.8 : L.speed;

    if (roma.moving && want && want.x === -roma.dir.x && want.y === -roma.dir.y) reverse(roma);
    const b = pos(roma);
    stepEnt(roma, dt, romaChoose, romaArrive);
    if (state !== 'play') return;
    const a = pos(roma);
    walk += Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
    if (boost > 0 && roma.moving && Math.random() < 0.6)
      parts.push({ x: a.x * T + T / 2, y: a.y * T + T / 2 + 8, vx: (Math.random() - .5), vy: (Math.random() - .5), life: .35, color: '#6bff9a', s: 3 });

    const ramp = 1 + Math.min(levelTime, 60) / 300; // з часом Крим трохи пришвидшується
    crimeas.forEach((c, k) => {
      if (c.home > 0) { c.home -= dt; return; }
      const base = L.cspeed[k] || L.cspeed[0];
      c.speed = scared > 0 ? base * 0.55 : base * ramp;
      stepEnt(c, dt, e => crimChoose(e, k));
    });

    for (const c of crimeas) {
      const cp = pos(c);
      if (Math.hypot(cp.x - a.x, cp.y - a.y) < 0.65) {
        if (scared > 0) {
          score += 200; toast('Крим повернуто Україні! +200');
          burst(cp.x * T + T / 2, cp.y * T + T / 2, '#ffd500', 18, 4); burst(cp.x * T + T / 2, cp.y * T + T / 2, '#3d7bff', 18, 4);
          c.tx = c.sx; c.ty = c.sy; c.prog = 0; c.moving = false; c.dir = { x: 0, y: 0 }; c.home = 2.5;
          beep(200, .25, 'square', .07, 1200);
        } else {
          lives--; state = 'dying'; stateT = 0; shake = 8;
          beep(600, .9, 'sawtooth', .07, 60);
          return;
        }
      }
    }
  } else if (state === 'dying') {
    if (stateT > 1.6) {
      if (lives <= 0) { state = 'gameover'; stateT = 0; beep(200, .6, 'triangle', .1, 80); }
      else { resetPositions(); state = 'ready'; stateT = 0.6; }
    }
  } else if (state === 'levelup') {
    if (stateT > 2.4) {
      lvl++;
      if (lvl >= LEVELS.length) { state = 'win'; stateT = 0; }
      else { loadLevel(lvl); state = 'ready'; stateT = 0; }
    }
  } else if (state === 'ready') {
    if (stateT > 1.8) { state = 'play'; stateT = 0; }
  } else if (state === 'win') {
    if (Math.random() < 0.5) {
      const cols = ['#ffd500', '#3d7bff', '#ff5e7e', '#6bff9a'];
      parts.push({ x: Math.random() * W * T, y: -10, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 2, life: 3, color: cols[(Math.random() * 4) | 0], s: 5 });
    }
  }
}

// ===================== МАЛЮВАННЯ КАРТИ =====================
function drawFloor(g, x, y) {
  const px = x * T, py = y * T, v = hsh(x, y);
  g.fillStyle = L.floor[(x + y) & 1]; g.fillRect(px, py, T, T);
  if (L.style === 'wood') {
    g.fillStyle = L.floor[(x + y) & 1]; g.fillRect(px, py, T, T);
    g.fillStyle = 'rgba(0,0,0,.18)';
    g.fillRect(px, py + 15, T, 2);
    g.fillRect(px + ((y & 1) ? 8 : 24), py, 2, 15);
    g.fillRect(px + ((y & 1) ? 22 : 4), py + 17, 2, 15);
    g.fillStyle = 'rgba(255,255,255,.05)'; g.fillRect(px, py, T, 2);
  } else if (L.style === 'tile') {
    g.strokeStyle = 'rgba(0,0,0,.15)'; g.lineWidth = 1; g.strokeRect(px + .5, py + .5, T - 1, T - 1);
    g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(px + 3, py + 3, 6, 2);
  } else {
    g.fillStyle = 'rgba(0,0,0,.12)';
    if (v < .5) g.fillRect(px + v * 40, py + (1 - v) * 24, 3, 2);
    if (v > .7) g.fillRect(px + 6, py + v * 20, 2, 2);
  }
  if (y > 0 && isSolid(grid[y - 1][x])) {
    const gr = g.createLinearGradient(0, py, 0, py + 8);
    gr.addColorStop(0, 'rgba(0,0,0,.35)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(px, py, T, 8);
  }
}

function drawWall(g, x, y) {
  const px = x * T, py = y * T;
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const v = hsh(x * 2 + i, y * 2 + j), sx = px + i * 16, sy = py + j * 16;
    g.fillStyle = shade(L.wall, (v - .5) * 28); g.fillRect(sx, sy, 16, 16);
    g.fillStyle = 'rgba(255,255,255,.16)'; g.fillRect(sx, sy, 16, 2); g.fillRect(sx, sy, 2, 16);
    g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(sx, sy + 14, 16, 2); g.fillRect(sx + 14, sy, 2, 16);
  }
}

function drawFurn(g, x, y, c) {
  drawFloor(g, x, y);
  const px = x * T, py = y * T;
  const same = (dx, dy) => { const yy = y + dy, xx = x + dx; return yy >= 0 && yy < H && xx >= 0 && xx < W && grid[yy][xx] === c; };
  const up = same(0, -1), dn = same(0, 1), lf = same(-1, 0), rt = same(1, 0);
  const R = (col, a, b, w, h) => { g.fillStyle = col; g.fillRect(px + a, py + b, w, h); };
  const box = (col, m) => R(col, lf ? 0 : m, up ? 0 : m, T - (lf ? 0 : m) - (rt ? 0 : m), T - (up ? 0 : m) - (dn ? 0 : m));
  switch (c) {
    case 'B':
      box('#4a2e1a', 1); box('#3f6fd8', 4);
      for (let s = 2; s < T; s += 10) R('rgba(255,255,255,.12)', lf ? 0 : 4, s, T - (lf ? 0 : 4) - (rt ? 0 : 4), 3);
      if (!up) { R('#f2efe6', lf ? 2 : 6, 5, T - (lf ? 2 : 6) - (rt ? 2 : 6), 10); R('#d9d4c4', lf ? 2 : 6, 13, T - (lf ? 2 : 6) - (rt ? 2 : 6), 2); }
      break;
    case 'D': case 'P':
      box('#5d3a1c', 2); box('#8b5a2b', 4);
      R('rgba(255,255,255,.12)', 0, up ? 0 : 4, T, 2);
      if (c === 'P') {
        if (!up) {
          R('#111', 3, 2, 26, 18); R('#2ad0ff', 5, 4, 22, 13);
          R('#ff3df0', 7, 7, 8, 2); R('#fff35c', 9, 11, 12, 2);
          R('#222', 13, 20, 6, 3);
        } else {
          R('#e8e8e8', 4, 6, 18, 6); R('#bbb', 24, 6, 5, 8);
          R(`hsl(${(now * 120) % 360},90%,60%)`, 4, 14, 18, 1);
        }
      } else if (!up && !lf) {
        R('#2b2b2b', 6, 6, 8, 18); R('#ff3df0', 8, 10, 4, 2); R('#2ad0ff', 8, 14, 4, 2); // ПК-корпус з RGB
      } else if (up && !lf) {
        R('#ffde59', 8, 8, 10, 12); R('#c9a83a', 8, 8, 10, 2); // чипси
      }
      break;
    case 'W':
      box('#5a3216', 1); box('#7a4a26', 3);
      if (!rt) R('#4a2a12', T - 4, 0, 2, T); else R('#4a2a12', T - 1, 0, 1, T);
      if (!up) R('#e0c060', rt ? T - 5 : 4, 14, 3, 6);
      break;
    case 'S':
      box('#6e1c24', 1); box('#a8323a', 3);
      if (!up) R('#7e2028', lf ? 0 : 3, 3, T - (lf ? 0 : 3) - (rt ? 0 : 3), 10);
      R('rgba(0,0,0,.2)', T - 1, up ? 0 : 13, 1, T);
      break;
    case 'K':
      R('#9a9a9a', 0, 0, T, T); R('#d8d8d8', 1, 1, T - 2, T - 6); R('#777', 0, T - 5, T, 5);
      if (x % 2) { g.fillStyle = '#333'; g.beginPath(); g.arc(px + 10, py + 11, 5, 0, 7); g.arc(px + 22, py + 18, 5, 0, 7); g.fill(); }
      else { R('#5c8ec7', 6, 6, 20, 12); R('#3b6aa0', 8, 8, 16, 8); }
      break;
    case 'F':
      box('#9aa5ad', 1); box('#eef2f5', 3);
      R('#9aa5ad', 0, 12, T, 2); if (!rt) R('#888', T - 9, 4, 3, 6);
      break;
    case 'T':
      box('#6a4220', 2); box('#a87442', 4);
      if (!up && !lf) { g.fillStyle = '#fff'; g.beginPath(); g.arc(px + 20, py + 20, 7, 0, 7); g.fill(); g.fillStyle = '#e44'; g.fillRect(px + 17, py + 17, 6, 6); }
      break;
    case 'L':
      R('#4a2e1a', 0, 0, T, T);
      ['#e4572e', '#29335c', '#f3a712', '#669bbc', '#a8c686', '#c33c54'].forEach((col, i) => R(col, 2 + i * 5, 4 + ((x + i) % 3) * 2, 4, 10 - ((x + i) % 3) * 2));
      R('#2e1c10', 0, 14, T, 3);
      ['#669bbc', '#c33c54', '#a8c686', '#f3a712', '#29335c'].forEach((col, i) => R(col, 3 + i * 6, 19 + ((y + i) % 2) * 2, 5, 10 - ((y + i) % 2) * 2));
      break;
    case 'X':
      R('#a8743f', 1, 1, T - 2, T - 2); R('#c8955a', 3, 3, T - 6, T - 6); R('#e8d6a0', 14, 3, 4, T - 6);
      break;
  }
}

function renderMap() {
  mapCanvas = document.createElement('canvas'); mapCanvas.width = W * T; mapCanvas.height = H * T;
  const g = mapCanvas.getContext('2d');
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = grid[y][x];
    if (c === '#') drawWall(g, x, y);
    else if (c === '.' || c === 'E') drawFloor(g, x, y);
    else drawFurn(g, x, y, c);
  }
}

const ROMA_TOP = [
  '...hhhhh..',
  '..hhhhhhh.',
  '..hhsssss.',
  '..hssesse.',
  '...sfsfs..',
  '...ssmss..',
  '..tttttt..',
  '.ttwttttt.',
  'st.tttt.ts',
  's..tttt..s',
  '...tttt...',
  '...pppp...',
];
const LEGS = [
  ['...p..p...', '...p..p...', '..bb..bb..'],
  ['...pp.p...', '..pp...p..', '.bb....bb.'],
  ['...p.pp...', '..p...pp..', '..bb...bb.'],
];
const PAL = { h: '#d2611c', f: '#d98a52', s: '#f5cfa0', e: '#1a1a1a', m: '#b5523b', t: '#2b6cd4', w: '#ffd500', p: '#2a2a3a', b: '#eeeeee' };

function drawRoma(cx, cy, flip, frame, sc = 2) {
  const rows = ROMA_TOP.concat(LEGS[frame]);
  const w = 10 * sc, h = rows.length * sc, ox = cx - w / 2, oy = cy - h + 13;
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(cx, cy + 13, 9, 3, 0, 0, 7); ctx.fill();
  rows.forEach((r, j) => {
    for (let i = 0; i < 10; i++) {
      const ch = r[flip ? 9 - i : i];
      if (ch === '.') continue;
      ctx.fillStyle = PAL[ch]; ctx.fillRect(ox + i * sc, oy + j * sc, sc, sc);
    }
  });
}

// Крим малюється у 2x роздільності для детальнішої текстури
const OCS = 2, OW = 80, OH = 64, SW = 58, SH = 42, OX = (OW - SW) / 2, OY = (OH - SH * .92) / 2;
const cpt = (a, b) => [OX + a * SW, OY + b * SH];
function crimeaPath(g) {
  g.beginPath();
  CRIMEA.forEach(([a, b], i) => { const [X, Y] = cpt(a, b); i ? g.lineTo(X, Y) : g.moveTo(X, Y); });
  g.closePath();
}
const terrain = (() => {
  const c = document.createElement('canvas'); c.width = OW * OCS; c.height = OH * OCS;
  const g = c.getContext('2d'); g.scale(OCS, OCS); g.lineJoin = 'round';
  // морське сяйво
  crimeaPath(g); g.strokeStyle = 'rgba(90,170,255,.55)'; g.lineWidth = 5; g.stroke();
  g.save(); crimeaPath(g); g.clip();
  // степ
  const gr = g.createLinearGradient(0, OY, 0, OY + SH);
  gr.addColorStop(0, '#cfc65c'); gr.addColorStop(.5, '#9cbf4e'); gr.addColorStop(1, '#6fa040');
  g.fillStyle = gr; g.fillRect(0, 0, OW, OH);
  // поля
  for (let i = 0; i < 45; i++) {
    const [X, Y] = cpt(.08 + hsh(i, 7) * .85, .12 + hsh(i, 9) * .5);
    g.fillStyle = ['rgba(230,205,90,.45)', 'rgba(110,165,55,.4)', 'rgba(185,145,80,.35)'][i % 3];
    g.fillRect(X, Y, 3 + hsh(i, 3) * 4, 2 + hsh(i, 4) * 3);
  }
  g.strokeStyle = 'rgba(255,240,150,.22)'; g.lineWidth = .5;
  for (let i = -60; i < 80; i += 3) { g.beginPath(); g.moveTo(i, OY); g.lineTo(i + 18, OY + SH * .5); g.stroke(); }
  // Сиваш (рожеві солоні озера)
  g.fillStyle = 'rgba(235,140,175,.8)';
  [[.44, .15, 4, 1.8], [.52, .2, 4, 2.2], [.58, .26, 3, 1.8]].forEach(([a, b, rx, ry]) => {
    const [X, Y] = cpt(a, b); g.beginPath(); g.ellipse(X, Y, rx, ry, .4, 0, 7); g.fill();
  });
  // ліси біля гір
  for (let i = 0; i < 30; i++) {
    const t = hsh(i, 11), [X, Y] = cpt(.30 + .44 * t, .70 - .22 * t - hsh(i, 12) * .07);
    g.fillStyle = i % 2 ? '#3f7a2e' : '#2f6224'; g.beginPath(); g.arc(X, Y, 1.5, 0, 7); g.fill();
  }
  // Кримські гори зі сніговими верхівками
  for (let i = 0; i < 7; i++) {
    const t = i / 6, [X, Y] = cpt(.32 + .40 * t, .78 - .22 * t), h = 4 + hsh(i, 5) * 3;
    g.fillStyle = '#8a6a4a'; g.beginPath(); g.moveTo(X - 4, Y + 1); g.lineTo(X, Y - h); g.lineTo(X + 4, Y + 1); g.fill();
    g.fillStyle = '#6b4f36'; g.beginPath(); g.moveTo(X, Y - h); g.lineTo(X + 4, Y + 1); g.lineTo(X + .5, Y + 1); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.moveTo(X - 1.3, Y - h + 2); g.lineTo(X, Y - h); g.lineTo(X + 1.3, Y - h + 2); g.fill();
  }
  // пляжі
  crimeaPath(g); g.strokeStyle = '#ead9a0'; g.lineWidth = 3; g.stroke();
  // міста
  [[.44, .54], [.27, .83], [.43, .83], [.93, .43], [.24, .62], [.74, .55]].forEach(([a, b]) => {
    const [X, Y] = cpt(a, b);
    g.fillStyle = '#fff'; g.fillRect(X - 1.2, Y - 1.2, 2.4, 2.4); g.fillStyle = '#c33'; g.fillRect(X - .7, Y - .7, 1.4, 1.4);
  });
  g.restore();
  crimeaPath(g); g.strokeStyle = '#2f4a1c'; g.lineWidth = 1.2; g.stroke();
  return c;
})();

function drawBoobs(g, x, y, isScared, flash) {
  for (const s of [-1, 1]) {
    const X = x + s * 4.4;
    const gr = g.createRadialGradient(X - 1.2, y - 1.5, .5, X, y, 4.6);
    if (isScared) { gr.addColorStop(0, flash ? '#fff' : '#8fb0ff'); gr.addColorStop(1, flash ? '#ccc' : '#2a55d8'); }
    else { gr.addColorStop(0, '#dcef93'); gr.addColorStop(1, '#7fae44'); }
    g.fillStyle = gr; g.beginPath(); g.arc(X, y, 4.6, 0, 7); g.fill();
    g.strokeStyle = '#2f4a1c'; g.lineWidth = .8; g.stroke();
    // купальник
    g.fillStyle = '#e2304a'; g.beginPath();
    g.moveTo(X - 3.6, y + 1.6); g.lineTo(X + 3.6, y + 1.6); g.lineTo(X + s * .4, y - 3.6); g.closePath(); g.fill();
    g.fillStyle = '#fff';
    g.fillRect(X - 1.6, y, .9, .9); g.fillRect(X + .9, y - .2, .9, .9); g.fillRect(X - .2, y - 2, .9, .9);
  }
  g.strokeStyle = '#e2304a'; g.lineWidth = .7; g.beginPath();
  g.moveTo(x - .9, y + 1); g.lineTo(x + .9, y + 1);
  g.moveTo(x - 4.4 - .4, y - 3.4); g.lineTo(x - 7, y - 8);
  g.moveTo(x + 4.4 + .4, y - 3.4); g.lineTo(x + 7, y - 8);
  g.stroke();
}

const oc = document.createElement('canvas'); oc.width = OW * OCS; oc.height = OH * OCS;
const og = oc.getContext('2d');
function drawCrimea(cx, cy, dir, t, isScared, flash, sc = 1) {
  og.setTransform(1, 0, 0, 1, 0, 0); og.clearRect(0, 0, oc.width, oc.height);
  og.globalCompositeOperation = 'source-over';
  og.drawImage(terrain, 0, 0);
  og.setTransform(OCS, 0, 0, OCS, 0, 0);
  if (isScared) {
    og.globalCompositeOperation = 'source-atop';
    og.fillStyle = flash ? 'rgba(255,255,255,.8)' : 'rgba(40,80,255,.6)'; og.fillRect(0, 0, OW, OH);
    og.globalCompositeOperation = 'source-over';
  }
  const mx = OX + .52 * SW, my = OY + .5 * SH;
  if (!isScared) {
    const ang = (dir.x || dir.y) ? Math.atan2(dir.y, dir.x) : 0, op = .08 + .42 * Math.abs(Math.sin(t * 10));
    og.globalCompositeOperation = 'destination-out';
    og.beginPath(); og.moveTo(mx, my); og.arc(mx, my, 60, ang - op, ang + op); og.closePath(); og.fill();
    og.globalCompositeOperation = 'source-over';
  }
  // груди (зсуваються, щоб не перекривати рот)
  const jig = Math.sin(t * 14) * .6;
  if (dir.y > 0) drawBoobs(og, mx - 10, my + 3 + jig, isScared, flash);
  else drawBoobs(og, mx - 7, my + 8 + jig, isScared, flash);
  const ey = my - 8, eyes = dir.y < 0 ? [mx - 13, mx + 7] : [mx - 9, mx + 5];
  eyes.forEach((ex, i) => {
    og.fillStyle = '#fff'; og.beginPath(); og.arc(ex, ey, 4, 0, 7); og.fill();
    og.fillStyle = isScared ? '#fff' : '#111';
    og.beginPath(); og.arc(ex + dir.x * 1.6, ey + dir.y * 1.6, 2, 0, 7); og.fill();
    if (!isScared) { // злі брови
      og.strokeStyle = '#4a2a00'; og.lineWidth = 2; og.beginPath();
      if (i === 0) { og.moveTo(ex - 5, ey - 7); og.lineTo(ex + 3, ey - 4); } else { og.moveTo(ex - 3, ey - 4); og.lineTo(ex + 5, ey - 7); }
      og.stroke();
    }
  });
  if (isScared) {
    og.strokeStyle = flash ? '#c00' : '#fff'; og.lineWidth = 1.5; og.beginPath();
    for (let i = 0; i <= 6; i++) { const X = mx - 10 + i * 3.4, Y = my - 1 + (i % 2 ? 1.5 : -1); i ? og.lineTo(X, Y) : og.moveTo(X, Y); }
    og.stroke();
  }
  ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, 18, 20, 4, 0, 0, 7); ctx.fill();
  ctx.drawImage(oc, -40, -32 + Math.sin(t * 14) * 1.2, OW, OH);
  ctx.restore();
}

function drawFlag(px, py, s = 1) {
  ctx.fillStyle = '#7a5434'; ctx.fillRect(px - 9 * s, py - 10 * s, 2 * s, 22 * s);
  const wv = Math.sin(now * 6) * 1.5 * s;
  ctx.fillStyle = '#0057b7'; ctx.fillRect(px - 7 * s, py - 10 * s + wv * .3, 18 * s, 6 * s);
  ctx.fillStyle = '#ffd500'; ctx.fillRect(px - 7 * s, py - 4 * s + wv * .3, 18 * s, 6 * s);
}

function drawDoor() {
  const px = exitT.x * T, py = exitT.y * T;
  ctx.fillStyle = '#3a2414'; ctx.fillRect(px, py, T, T);
  ctx.fillStyle = unlocked ? '#3fbf5a' : '#b8332e'; ctx.fillRect(px + 3, py + 3, T - 6, T - 6);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(px + 7, py + 6, T - 14, 8); ctx.fillRect(px + 7, py + 18, T - 14, 8);
  ctx.fillStyle = '#ffd34d'; ctx.fillRect(px + T - 10, py + 15, 3, 3);
  if (unlocked) {
    ctx.strokeStyle = `rgba(120,255,140,${.5 + .5 * Math.sin(now * 8)})`; ctx.lineWidth = 3;
    ctx.strokeRect(px - 2, py - 2, T + 4, T + 4);
  } else {
    ctx.fillStyle = '#ffd34d'; ctx.fillRect(px + 10, py + 14, 12, 9);
    ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px + 16, py + 14, 4, Math.PI, 0); ctx.stroke();
  }
}

function emoji(s, x, y, size) {

}
function panel(y, h) {

function render() {
  ctx.fillStyle = '#120c1c'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.save();
  ctx.translate((Math.random() - .5) * shake, HUD + (Math.random() - .5) * shake);
  ctx.drawImage(mapCanvas, 0, 0);
  ctx.fillStyle = 'rgba(8,4,16,.38)'; ctx.fillRect(0, 0, W * T, H * T); // притемнення фону
  drawDoor();

  for (const it of items) if (!it.got) {
    const px = it.x * T + T / 2, py = it.y * T + T / 2 + Math.sin(now * 4 + it.x) * 2;
    const gl = ctx.createRadialGradient(px, py, 2, px, py, 15);
    gl.addColorStop(0, 'rgba(255,240,140,.6)'); gl.addColorStop(1, 'rgba(255,240,140,0)');
    ctx.fillStyle = gl; ctx.fillRect(px - 16, py - 16, 32, 32);
    emoji(it.k[0], px, py, 18);
  }
  for (const p of powers) if (!p.got) {
    const px = p.x * T + T / 2, py = p.y * T + T / 2 + Math.sin(now * 5 + p.y) * 2;
    if (p.t === 'f') drawFlag(px, py);
    else emoji('🥤', px, py, 20);
  }

  if (state !== 'title') {
    const rp = pos(roma), rx = rp.x * T + T / 2, ry = rp.y * T + T / 2;
    if (state === 'dying') {
      ctx.save(); ctx.translate(rx, ry); ctx.rotate(stateT * 12);
      const s = Math.max(0.01, 1 - stateT / 1.4); ctx.scale(s, s);
      drawRoma(0, 0, false, 0); ctx.restore();
    } else if (state !== 'levelup' || stateT < .2) {
      const frame = roma.moving ? 1 + (Math.floor(walk * 3) % 2) : 0;
      drawRoma(rx, ry, roma.dir.x < 0, frame);
    }
    crimeas.forEach(c => {
      const cp = pos(c);
      const flash = scared > 0 && scared < 1.8 && Math.floor(now * 8) % 2 === 0;
      if (c.home > 0 && state === 'play' && Math.floor(now * 10) % 2) ctx.globalAlpha = .5;
      drawCrimea(cp.x * T + T / 2, cp.y * T + T / 2, c.dir, now, scared > 0, flash);
      ctx.globalAlpha = 1;
    });
  }

  for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.s, p.s); }
  ctx.globalAlpha = 1;

  // тости
  msgs.forEach((m, i) => {
    const y = H * T - 20 - (msgs.length - 1 - i) * 26;
    ctx.globalAlpha = Math.min(1, m.t * 2);
    ctx.font = `10px ${FONT}`; const w = ctx.measureText(m.text).width + 40;
    ctx.fillStyle = 'rgba(14,8,26,.85)'; ctx.fillRect(cv.width / 2 - w / 2, y - 11, w, 22);
    ctx.font = `12px ${EMOJI}`;
    text(m.text, cv.width / 2, y, 10, '#ffe66b', 'center', false);
    ctx.globalAlpha = 1;
  });
  ctx.restore();

  drawHUD();
  drawOverlay();
}

function renderBg() {
  bctx.clearRect(0, 0, innerWidth, innerHeight);
  bctx.textAlign = 'center'; bctx.textBaseline = 'middle';
  for (const f of falling) {
    bctx.save(); bctx.globalAlpha = f.a; bctx.translate(f.x, f.y); bctx.rotate(f.rot);
    bctx.font = `${f.size}px ${FONT}`;
    f.lines.forEach((l, i) => {
      const y = i * f.size * 1.6;
      bctx.fillStyle = 'rgba(0,0,0,.8)'; bctx.fillText(l, 2, y + 2);
      bctx.fillStyle = f.color; bctx.fillText(l, 0, y);
    });
    bctx.restore();
  }
}

function drawHUD() {
  ctx.fillStyle = '#1d1430'; ctx.fillRect(0, 0, cv.width, HUD);
  ctx.fillStyle = '#3b2a52'; ctx.fillRect(0, HUD - 3, cv.width, 3);
  if (state === 'title') { text('ВТЕЧА РОМИ', cv.width / 2, 20, 12, '#ffd500'); return; }
  text(`${lvl + 1}/3 ${L.name}`, 10, 20, 9, '#ffd500', 'left', false);
  const ix = 250;
  items.forEach((it, i) => { ctx.globalAlpha = it.got ? 1 : .25; emoji(it.k[0], ix + i * 22, 20, 16); });
  ctx.globalAlpha = 1;
  for (let i = 0; i < 3; i++) { ctx.globalAlpha = i < lives ? 1 : .2; emoji('❤️', 430 + i * 20, 20, 14); }
  ctx.globalAlpha = 1;
  text(String(score).padStart(5, '0'), cv.width - 10, 20, 11, '#fff', 'right', false);
  if (boost > 0) { ctx.fillStyle = '#6bff9a'; ctx.fillRect(0, HUD - 3, cv.width * boost / 4.5, 3); }
  if (scared > 0) { ctx.fillStyle = '#ffd500'; ctx.fillRect(0, HUD - 3, cv.width * scared / 6, 3); ctx.fillStyle = '#0057b7'; ctx.fillRect(0, HUD - 3, cv.width * scared / 12, 3); }
}

function drawOverlay() {
  const cx = cv.width / 2, mid = HUD + H * T / 2;
  if (state === 'title') {
    ctx.fillStyle = 'rgba(10,6,20,.72)'; ctx.fillRect(0, HUD, cv.width, H * T);
    text('ВТЕЧА', cx, mid - 150, 34, '#ffd500');
    text('РОМИ', cx, mid - 105, 34, '#3d7bff');
    text('Рома тікає зі своєї кімнати.', cx, mid - 50, 10, '#fff');
    text('А за ним женеться... ПІВОСТРІВ КРИМ!', cx, mid - 30, 10, '#ff8a5c');
    text('Збери всі речі — двері відчиняться.', cx, mid + 5, 9, '#ccc');
    text('🥤 = швидкість   прапор = Крим тікає від тебе', cx, mid + 25, 9, '#ccc');
    text('Стрілки / WASD / свайпи   M — музика', cx, mid + 45, 9, '#ccc');
    if (Math.floor(now * 2) % 2) text('ENTER або тап — ГРАТИ', cx, mid + 85, 13, '#6bff9a');
    // анімована погоня
    const span = cv.width + 260, rx = ((now * 150) % span) - 60;
    drawRoma(rx, HUD + H * T - 40, false, 1 + (Math.floor(now * 8) % 2));
    drawCrimea(rx - 90, HUD + H * T - 40, { x: 1, y: 0 }, now, false, false, 1.2);
    drawFlag(cx + 200, mid - 125, 1.4);
    return;
  }
  if (state === 'ready') {
    panel(mid - 55, 110);
    text(`РІВЕНЬ ${lvl + 1}`, cx, mid - 25, 20, '#ffd500');
    text(L.name, cx, mid + 8, 12, '#fff');
    text(['Збери речі і тікай!', 'Крим не відстає...', 'Тепер їх ДВА!'][lvl], cx, mid + 33, 9, '#ff8a5c');
  } else if (state === 'levelup') {
    panel(mid - 50, 100);
    text('РОМА ВИБІГ!', cx, mid - 18, 18, '#6bff9a');
    text(`Бонус за швидкість: +${levelBonus}`, cx, mid + 18, 10, '#fff');
  } else if (state === 'gameover') {
    panel(mid - 90, 180);
    drawCrimea(cx, mid - 50, { x: 0, y: 1 }, now, false, false, 1.4);
    text('КРИМ НАЗДОГНАВ РОМУ!', cx, mid + 5, 15, '#ff5e5e');
    text(`Рахунок: ${score}`, cx, mid + 38, 11, '#fff');
    if (Math.floor(now * 2) % 2) text('ENTER / тап — ще раз', cx, mid + 65, 10, '#6bff9a');
  } else if (state === 'win') {
    panel(mid - 100, 200);
    drawRoma(cx - 30, mid - 55, false, 1 + (Math.floor(now * 6) % 2));
    drawFlag(cx + 30, mid - 60, 1.3);
    text('РОМА ВТІК НА ВОЛЮ!', cx, mid - 5, 16, '#ffd500');
    text(`Рахунок: ${score}`, cx, mid + 25, 11, '#fff');
    text(`Час: ${totalTime.toFixed(1)} с`, cx, mid + 47, 11, '#fff');
    if (Math.floor(now * 2) % 2) text('ENTER / тап — грати знову', cx, mid + 77, 10, '#6bff9a');
  }
}

// ===================== КЕРУВАННЯ =====================
const KEYS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], KeyA: [-1, 0], KeyD: [1, 0], KeyW: [0, -1], KeyS: [0, 1] };
function action() { startMusic(); if (state === 'title' || state === 'gameover' || state === 'win') newGame(); }
addEventListener('keydown', ev => {
  const k = KEYS[ev.code];
  if (k) { want = { x: k[0], y: k[1] }; ev.preventDefault(); }
  if (ev.code === 'Enter' || ev.code === 'Space') { ev.preventDefault(); action(); }
  if (ev.code === 'KeyM') { if (musicStarted) toggleMusic(); else startMusic(); }
});
let ts0 = null;
addEventListener('touchstart', ev => { const t = ev.touches[0]; ts0 = { x: t.clientX, y: t.clientY, moved: false }; }, { passive: true });
addEventListener('touchmove', ev => {
  if (!ts0) return;
  const t = ev.touches[0], dx = t.clientX - ts0.x, dy = t.clientY - ts0.y;
  if (Math.hypot(dx, dy) > 22) {
    want = Math.abs(dx) > Math.abs(dy) ? { x: Math.sign(dx), y: 0 } : { x: 0, y: Math.sign(dy) };
    ts0 = { x: t.clientX, y: t.clientY, moved: true };
  }
}, { passive: true });
addEventListener('touchend', () => { if (ts0 && !ts0.moved) action(); ts0 = null; });
cv.addEventListener('mousedown', action);

// ===================== СТАРТ =====================
loadLevel(0);
let last = performance.now();
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t; now += dt;
  update(dt); render(); renderBg();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
